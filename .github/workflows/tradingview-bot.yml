name: TradingView bot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      HEADLESS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore TradingView cookies
        shell: bash
        env:
          TRADINGVIEW_COOKIES_B64: ${{ secrets.TRADINGVIEW_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$TRADINGVIEW_COOKIES_B64" ]; then
            echo "TRADINGVIEW_COOKIES_B64 secret is empty or missing."
            exit 1
          fi
          printf '%s' "$TRADINGVIEW_COOKIES_B64" | base64 --decode > tradingview_cookies.pkl
          if [ ! -s tradingview_cookies.pkl ]; then
            echo "TRADINGVIEW_COOKIES_B64 decoded to an empty file."
            exit 1
          fi
          python - <<'PY'
          import pickle

          with open("tradingview_cookies.pkl", "rb") as cookies_file:
              cookies = pickle.load(cookies_file)
          if not isinstance(cookies, list) or not cookies:
              raise SystemExit("TradingView cookie secret is not a non-empty cookie list.")
          print(f"Restored {len(cookies)} TradingView cookies.")
          PY

      - name: Run bot
        run: python main.py